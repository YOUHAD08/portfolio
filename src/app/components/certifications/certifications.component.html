<section class="certifications" id="certification">
  <div class="certifications__inner">
    <div class="certifications__header-row">
      <button class="certifications__nav" [disabled]="!canScrollLeft" (click)="scroll(-1)" [attr.aria-label]="t.prev">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      </button>

      <div class="certifications__header">
        <span class="certifications__pill">{{ t.pill }}</span>
        <h2 class="certifications__heading">{{ t.heading }}</h2>
        <p class="certifications__tagline">{{ t.tagline }}</p>
      </div>

      <button class="certifications__nav" [disabled]="!canScrollRight" (click)="scroll(1)" [attr.aria-label]="t.next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <div class="certifications__tabs">
      <button
        class="certifications__tab"
        *ngFor="let cat of categories"
        [class.is-active]="cat.id === activeId"
        (click)="selectCategory(cat.id)"
      >
        {{ categoryLabel(cat) }}
        <span class="certifications__tab-count">{{ cat.items.length }}</span>
      </button>
    </div>

    <div class="certifications__carousel">
      <div
        class="certifications__track"
        #track
        (scroll)="onScroll()"
        (mouseenter)="onTrackMouseEnter()"
        (mouseleave)="onTrackMouseLeave()"
      >
        <article class="certifications__card" *ngFor="let item of trackItems; trackBy: trackByIndex">
          <div
            class="certifications__image"
            [class.no-image]="!item.image"
            [style.--glow]="glow(item)"
          >
            <span class="certifications__in-progress" *ngIf="item.inProgress">{{ t.inProgress }}</span>

            <img
              *ngIf="item.image"
              class="certifications__badge-img"
              [src]="item.image"
              [alt]="item.title"
              (load)="onImageLoad($event, item.title)"
            />

            <div class="certifications__badge certifications__badge--placeholder" *ngIf="!item.image && placeholderIcon(item) as def">
              <img *ngIf="def.img" [src]="def.img" [alt]="item.title" />
              <svg *ngIf="!def.img" [attr.viewBox]="def.viewBox" xmlns="http://www.w3.org/2000/svg">
                <path *ngFor="let p of def.paths" [attr.d]="p.d" [attr.fill]="p.fill"></path>
              </svg>
            </div>

            <div class="certifications__badge" *ngIf="!item.image && !placeholderIcon(item)">
              <svg *ngIf="activeId === 'education'" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"></path></svg>
              <svg *ngIf="activeId === 'certification'" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"></path></svg>
              <svg *ngIf="activeId === 'course'" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>

            <div class="certifications__image-fade"></div>

            <div class="certifications__image-content">
              <h4 class="certifications__title">{{ item.title }}</h4>
              <p class="certifications__meta">{{ item.issuer }}<ng-container *ngIf="item.date"> &middot; {{ item.date }}</ng-container></p>
            </div>
          </div>

          <a
            class="certifications__cta"
            [class.is-disabled]="!item.credentialUrl"
            [href]="item.credentialUrl || null"
            [attr.target]="item.credentialUrl ? '_blank' : null"
            rel="noopener"
          >
            <svg *ngIf="!item.inProgress" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="10"></circle></svg>
            <svg *ngIf="item.inProgress" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
            {{ item.inProgress ? t.inProgress : (item.credentialUrl ? t.verify : t.noLink) }}
          </a>
        </article>
      </div>
    </div>
  </div>
</section>
